name: Quality

on:
  push:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install JavaScript tools
        run: npm ci

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: >-
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0
          -Scope CurrentUser -Force

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=low

      - name: Run quality gates
        run: pre-commit run --all-files --show-diff-on-failure

  static-analysis:
    name: Native and semantic static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"
          arch: linux_gcc_64
          cache: true

      - name: Install analyzers
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-tidy cppcheck ninja-build
          python -m pip install semgrep==1.174.0

      - name: Configure compilation database
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-analysis -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build strict native target
        run: cmake --build build-analysis --parallel

      - name: Run clang-tidy
        run: >-
          run-clang-tidy -p build-analysis -quiet
          "^${{ github.workspace }}/src/.*\\.cpp$"

      - name: Run exhaustive cppcheck
        run: >-
          cppcheck --project=build-analysis/compile_commands.json
          --file-filter="*/src/*.cpp" --enable=all --inconclusive
          --check-level=exhaustive --std=c++20 --inline-suppr
          --suppress=missingIncludeSystem --suppress=unusedFunction
          --error-exitcode=1 --quiet

      - name: Run Semgrep
        run: >-
          semgrep scan --config auto --error --metrics=on
          src include browser/extension scripts tests

  native-build:
    name: ${{ matrix.name }} build and tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            qt-arch: win64_msvc2022_64
            cmake-args: -A x64
          - name: Linux
            os: ubuntu-latest
            qt-arch: linux_gcc_64
            cmake-args: -G Ninja -DCMAKE_BUILD_TYPE=Release
          - name: macOS
            os: macos-latest
            qt-arch: clang_64
            cmake-args: -G Ninja -DCMAKE_BUILD_TYPE=Release
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"
          arch: ${{ matrix.qt-arch }}
          cache: true

      - name: Configure
        run: cmake -S . -B build ${{ matrix.cmake-args }} -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure --verbose
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem build -Filter 'test_*.txt' | ForEach-Object {
              Write-Output "--- $($_.Name) ---"
              Get-Content $_.FullName
            }
            exit $LASTEXITCODE
          }

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan
            cmake-option: -DENABLE_ASAN_UBSAN=ON
          - name: TSan
            cmake-option: -DENABLE_TSAN=ON
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"
          arch: linux_gcc_64
          cache: true

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON ${{ matrix.cmake-option }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/tsan.supp
        run: ctest --test-dir build --output-on-failure
