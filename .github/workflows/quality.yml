name: Quality

on:
  push:

permissions:
  contents: read

env:
  # The browser the live suites measure against, pinned like every other tool in this workflow.
  CHROME_VERSION: 153.0.8010.52

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install JavaScript tools
        run: npm ci

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=low

      - name: Install VS Code extension tools
        run: npm ci --prefix vscode

      - name: Audit VS Code extension dependencies
        run: npm audit --audit-level=low --prefix vscode

      # The extension is TypeScript under strict compiler settings, so type
      # checking is its lint: nothing else in this repository would catch a
      # broken call into the editor API before the marketplace build.
      - name: Type-check VS Code extension
        run: npm run lint --prefix vscode

      - name: Run quality gates
        env:
          SKIP: psscriptanalyzer
        run: pre-commit run --all-files --show-diff-on-failure

  powershell-analysis:
    name: PowerShell static analysis
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: >-
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0
          -Scope CurrentUser -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: ./scripts/run_psscriptanalyzer.ps1

  static-analysis:
    name: Native and semantic static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"
          arch: linux_gcc_64
          cache: true

      - name: Install analyzers
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-tidy cppcheck ninja-build
          python -m pip install semgrep==1.174.0

      - name: Configure compilation database
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-analysis -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build strict native target
        run: cmake --build build-analysis --parallel

      - name: Run clang-tidy
        run: run-clang-tidy -p build-analysis -quiet

      - name: Run exhaustive cppcheck
        run: >-
          cppcheck --project=build-analysis/compile_commands.json
          --enable=all --inconclusive --check-level=exhaustive
          --std=c++20 --inline-suppr
          --suppress=missingIncludeSystem --suppress=unusedFunction
          --error-exitcode=1 --quiet

      - name: Run Semgrep
        run: >-
          semgrep scan --config auto --error --metrics=on
          src include browser/extension scripts tests

  native-build:
    name: ${{ matrix.name }} build and tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            qt-arch: win64_msvc2022_64
            cmake-args: -A x64
          - name: Linux
            os: ubuntu-latest
            qt-arch: linux_gcc_64
            cmake-args: -G Ninja -DCMAKE_BUILD_TYPE=Release
          - name: macOS
            os: macos-latest
            qt-arch: clang_64
            cmake-args: -G Ninja -DCMAKE_BUILD_TYPE=Release
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"
          arch: ${{ matrix.qt-arch }}
          cache: true

      - name: Configure
        run: cmake -S . -B build ${{ matrix.cmake-args }} -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure --verbose
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem build -Filter 'test_*.txt' | ForEach-Object {
              Write-Output "--- $($_.Name) ---"
              Get-Content $_.FullName
            }
            exit $LASTEXITCODE
          }

  live-browser:
    name: ${{ matrix.name }} live browser suites
    runs-on: ${{ matrix.os }}
    # Everything here waits on a browser; without this a hung one would hold a runner for hours.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            qt-arch: linux_gcc_64
            # This image's kernel forbids unprivileged user namespaces, which leaves Chrome with
            # no usable sandbox and it refuses to start, and it has no GPU to rasterize with.
            # Only the dedicated test browser is affected; nothing here changes how the product
            # runs.
            chrome-args: --chrome-arg=--no-sandbox --chrome-arg=--disable-gpu
              --chrome-arg=--use-angle=swiftshader
              --chrome-arg=--enable-unsafe-swiftshader
          - name: macOS
            os: macos-latest
            qt-arch: clang_64
            chrome-args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"
          arch: ${{ matrix.qt-arch }}
          cache: true

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel

      # A dedicated browser for the suites: its own profile, its own bridge, headless. Chrome for
      # Testing is required -- branded Chrome ignores --load-extension. Pinned like every other
      # tool here: these suites measure tolerances of a device pixel or two against Chrome's own
      # compositor, and a browser that changed under them would read as a regression.
      - name: Install Chrome for Testing
        id: chrome
        run: |
          installed=$(npx -y @puppeteer/browsers@latest install chrome@${{ env.CHROME_VERSION }} --path "$PWD/.chrome-for-testing")
          {
            echo "path<<CHROME_PATH_EOF"
            echo "${installed#* }"
            echo "CHROME_PATH_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Display scale, zoom, and pinch matrix
        run: >-
          node tests/e2e/display_matrix_e2e.mjs
          --chrome="${{ steps.chrome.outputs.path }}" --parallel=2
          ${{ matrix.chrome-args }} | tee display-matrix.json

      # Not on Linux: this runner's Chrome never answers a screenshot taken under an emulated
      # fractional device-scale override (measured four times, across --no-sandbox, --disable-gpu,
      # and SwiftShader, while the same capture at 1x in the same run succeeds). The same capture
      # returns in 72 ms on a real Linux Chrome and passes on the macOS runner, so the suite runs
      # there and this job covers Linux with the matrix and the interference suite.
      - name: Full browser E2E
        if: runner.os != 'Linux'
        run: >-
          node tests/e2e/isolated_run.mjs --chrome="${{ steps.chrome.outputs.path }}"
          ${{ matrix.chrome-args }} tests/e2e/full_browser_e2e.mjs | tee full-browser-e2e.json

      - name: User interference E2E
        run: >-
          node tests/e2e/isolated_run.mjs --chrome="${{ steps.chrome.outputs.path }}"
          ${{ matrix.chrome-args }} tests/e2e/user_interference_e2e.mjs
          | tee user-interference-e2e.json

      # What each suite measured, kept whether it passed or failed: the reports carry the
      # per-configuration numbers a failure has to be read against.
      - name: Keep the suites' reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-browser-reports-${{ matrix.name }}
          path: "*.json"
          if-no-files-found: warn
          retention-days: 14

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan
            cmake-option: -DENABLE_ASAN_UBSAN=ON
          - name: TSan
            cmake-option: -DENABLE_TSAN=ON
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"
          arch: linux_gcc_64
          cache: true

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON ${{ matrix.cmake-option }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
