name: Quality

on:
  push:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether anything but documents changed. A push of Markdown and docs/ alone -- release notes,
  # evidence, a verification record -- has nothing to build: it gets the formatting, lint and secret
  # scan below and the checks that read those documents, and every other job is skipped. A new
  # branch or a tag, which has nothing to compare with, counts as code.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          code=true
          if [ "$GITHUB_REF_TYPE" != "tag" ] && [ -n "$BEFORE" ] &&
            [ "$BEFORE" != "0000000000000000000000000000000000000000" ] &&
            git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if ! git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -vE '\.md$|^docs/' | grep -q .; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Anything but documents changed: $code"

  quality:
    name: Format, lint, and secret scan
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install JavaScript tools
        run: npm ci

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=low

      - name: Install VS Code extension tools
        run: npm ci --prefix vscode

      - name: Audit VS Code extension dependencies
        run: npm audit --audit-level=low --prefix vscode

      # The extension is TypeScript under strict compiler settings, so type
      # checking is its lint: nothing else in this repository would catch a
      # broken call into the editor API before the marketplace build.
      - name: Type-check VS Code extension
        run: npm run lint --prefix vscode

      - name: Run quality gates
        env:
          SKIP: psscriptanalyzer
        run: pre-commit run --all-files --show-diff-on-failure

      # On a docs-only push the builds are skipped, and with them ctest's copy of these: that every
      # version agrees with its changelog entry and release page, and that the README's links
      # survive into the VS Code package.
      - name: Check the release documents
        if: needs.changes.outputs.code == 'false'
        run: node --test tests/test_release_versions.mjs tests/test_vscode_payload.mjs

  powershell-analysis:
    name: PowerShell static analysis
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: >-
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0
          -Scope CurrentUser -Force

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: ./scripts/run_psscriptanalyzer.ps1

  static-analysis:
    name: Native and semantic static analysis
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Keep the Python pinned above: left to itself the action switches the job to the newest
      # 3.x, and semgrep-core segfaults at start-up under Python 3.15.
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"
          arch: linux_gcc_64
          cache: true
          setup-python: false

      - name: Install analyzers
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-tidy cppcheck ninja-build
          python -m pip install semgrep==1.174.0

      - name: Configure compilation database
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-analysis -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build strict native target
        run: cmake --build build-analysis --parallel

      - name: Run clang-tidy
        run: run-clang-tidy -p build-analysis -quiet

      - name: Run exhaustive cppcheck
        run: >-
          cppcheck --project=build-analysis/compile_commands.json
          --enable=all --inconclusive --check-level=exhaustive
          --std=c++20 --inline-suppr
          --suppress=missingIncludeSystem --suppress=unusedFunction
          --error-exitcode=1 --quiet

      - name: Run Semgrep
        run: >-
          semgrep scan --config auto --error --metrics=on
          src include browser/extension scripts tests

  native-build:
    name: ${{ matrix.name }} build and tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            qt-arch: win64_msvc2022_64
            cmake-args: -A x64
            executable: build/Release/chrome_control_mcp.exe
          - name: Linux
            os: ubuntu-latest
            qt-arch: linux_gcc_64
            cmake-args: -G Ninja -DCMAKE_BUILD_TYPE=Release
            executable: build/chrome_control_mcp
          - name: macOS
            os: macos-latest
            qt-arch: clang_64
            cmake-args: -G Ninja -DCMAKE_BUILD_TYPE=Release
            executable: build/chrome_control_mcp
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"
          arch: ${{ matrix.qt-arch }}
          cache: true

      - name: Configure
        run: cmake -S . -B build ${{ matrix.cmake-args }} -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure --verbose
          if ($LASTEXITCODE -ne 0) {
            Get-ChildItem build -Filter 'test_*.txt' | ForEach-Object {
              Write-Output "--- $($_.Name) ---"
              Get-Content $_.FullName
            }
            exit $LASTEXITCODE
          }

      # The packaged-binary smoke check ran ONLY in the release workflow, so the tool count it
      # pins could not fail until a tag was already pushed -- which is how 1.6.0's four archive
      # jobs went red on a number three other tests had already been updated for. It needs a built
      # server, which this job has.
      - name: Smoke the built server
        shell: bash
        run: |
          node scripts/mcp_smoke.mjs "${{ matrix.executable }}"
          node scripts/mcp_smoke.mjs --read-only "${{ matrix.executable }}"

  sanitizers:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ASan + UBSan
            cmake-option: -DENABLE_ASAN_UBSAN=ON
          - name: TSan
            cmake-option: -DENABLE_TSAN=ON
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.10.0"
          arch: linux_gcc_64
          cache: true

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON ${{ matrix.cmake-option }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
