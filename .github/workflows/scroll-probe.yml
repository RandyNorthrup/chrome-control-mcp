# Temporary diagnostic: run tools/scroll_probe.mjs on macOS, where the live suite's nested-region
# scroll reports that nothing moved. Needs no Qt and no build, so it answers in about two minutes.
name: Scroll probe
on:
  push:
    branches: [scroll-probe]

jobs:
  probe:
    name: ${{ matrix.name }} scroll probe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            chrome-args: ""
          - name: Linux
            os: ubuntu-latest
            chrome-args: --no-sandbox --disable-gpu --use-angle=swiftshader --enable-unsafe-swiftshader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chrome for Testing
        id: chrome
        run: |
          installed=$(npx -y @puppeteer/browsers@latest install chrome@153.0.8010.52 --path "$PWD/.chrome-for-testing")
          {
            echo "path<<EOF"
            echo "${installed#* }"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Probe
        shell: bash
        run: node tools/scroll_probe.mjs "${{ steps.chrome.outputs.path }}" ${{ matrix.chrome-args }}
