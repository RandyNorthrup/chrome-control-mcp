<!doctype html>
<html>
<head><meta charset="utf-8">
<!--
  README banner, 1280x360 at 2x. Render with Chrome for Testing:
    chrome --headless=new --hide-scrollbars --force-device-scale-factor=2 --window-size=1280,360 \
      --screenshot=docs/assets/banner.png docs/assets/banner.html
  Same palette as the social preview: control pink, cyan, amber. No purple.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 360px; overflow: hidden; }
  body {
    background: #070a10;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    color: #eef2f7; position: relative;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .5; }
  .glow.pink { width: 520px; height: 520px; left: -160px; top: -300px;
    background: radial-gradient(circle, rgba(255,45,149,.62), transparent 65%); }
  .glow.cyan { width: 560px; height: 560px; right: -160px; bottom: -380px;
    background: radial-gradient(circle, rgba(34,211,238,.45), transparent 65%); }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse at 50% 50%, #000 40%, transparent 80%);
  }
  .wrap { position: relative; height: 100%; display: flex; align-items: center; gap: 40px; padding: 0 64px; }
  .mark { width: 128px; height: 128px; border-radius: 30px; flex: none; position: relative;
    background: linear-gradient(145deg, #131823, #0b0e15); border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 0 0 4px rgba(255,45,149,.18), 0 18px 40px rgba(0,0,0,.55); }
  .mark .frame { position: absolute; inset: 22px; border-radius: 12px; border: 3px solid #ff2d95;
    box-shadow: 0 0 18px rgba(255,45,149,.55) inset, 0 0 14px rgba(255,45,149,.45); }
  .mark svg { position: absolute; left: 58px; top: 50px; filter: drop-shadow(0 0 6px #ff2d95); }
  .text { flex: 1; }
  h1 { font-size: 64px; font-weight: 800; letter-spacing: -.025em; line-height: 1; }
  h1 .accent { background: linear-gradient(95deg, #ff2d95, #fb923c 55%, #22d3ee);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin-top: 14px; font-size: 23px; color: #a9b3c5; line-height: 1.4; }
  p b { color: #eef2f7; font-weight: 600; }
  .strip { margin-top: 22px; display: flex; align-items: flex-end; gap: 8px; height: 40px; }
  .tab { height: 30px; padding: 0 12px; border-radius: 8px 8px 0 0; background: #151a25; color: #8d96a8;
    font-size: 13px; display: flex; align-items: center; white-space: nowrap; }
  .tab.active { background: #1c2230; color: #eef2f7; }
  .group { display: flex; align-items: flex-end; gap: 6px; padding: 0 6px 0 8px; border-radius: 9px 9px 0 0; }
  .group .label { font-size: 11px; font-weight: 800; letter-spacing: .06em; padding-bottom: 8px; }
  .group.pink { background: rgba(255,45,149,.16); border-top: 2px solid #ff2d95; }
  .group.pink .label { color: #ff8cc6; }
  .group.cyan { background: rgba(34,211,238,.14); border-top: 2px solid #22d3ee; }
  .group.cyan .label { color: #8eecfa; }
  .group.amber { background: rgba(251,146,60,.14); border-top: 2px solid #fb923c; }
  .group.amber .label { color: #fdc79b; }
</style>
</head>
<body>
  <div class="glow pink"></div><div class="glow cyan"></div><div class="grid"></div>
  <div class="wrap">
    <div class="mark">
      <div class="frame"></div>
      <svg width="34" height="34" viewBox="0 0 24 24"><path d="M2 1 L2 19 L7 14 L10.5 21 L13.6 19.6 L10.1 13 L17 13 Z" fill="#fff" stroke="#12001a" stroke-width="1.3" stroke-linejoin="round"/></svg>
    </div>
    <div class="text">
      <h1>Chrome Control <span class="accent">MCP</span></h1>
      <p><b>Let AI agents use your real Chrome</b> &mdash; each in its own tabs, beside you, cleaned up when done.</p>
      <div class="strip">
        <div class="tab">Your tab</div>
        <div class="group pink"><span class="label">AI · research</span><div class="tab">Docs</div></div>
        <div class="group cyan"><span class="label">AI · writer</span><div class="tab active">Draft</div></div>
        <div class="group amber"><span class="label">AI · tests</span><div class="tab">Checkout</div></div>
      </div>
    </div>
  </div>
</body>
</html>
